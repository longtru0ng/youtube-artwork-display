name: S3MusicArtwork
options:
  bundleIdPrefix: com.s3musicdemo
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  S3MusicArtwork:
    type: application
    platform: iOS
    sources:
      - path: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.s3musicdemo.artwork
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Connect to my ESP32-S3 music display over Bluetooth."
        INFOPLIST_KEY_UIBackgroundModes: [bluetooth-central]
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: "NO"
