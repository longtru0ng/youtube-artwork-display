name: S3MusicArtwork
options:
  bundleIdPrefix: com.s3musicdemo
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  S3MusicArtwork:
    type: application
    platform: iOS
    sources:
      - path: iOS
    info:
      path: iOS/Info.plist
      properties:
        NSBluetoothAlwaysUsageDescription: "Connect to my ESP32-S3 music display over Bluetooth."
        UIBackgroundModes:
          - bluetooth-central
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.s3musicdemo.artwork
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: "NO"
